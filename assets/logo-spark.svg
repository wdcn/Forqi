<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Forqi spark mark">
  <!-- Radial spark: alternating long and short rays -->
  <g stroke="#F37021" stroke-width="7" stroke-linecap="round">
    <line x1="50" y1="8"  x2="50" y2="30"/>
    <line x1="50" y1="8"  x2="50" y2="30" transform="rotate(60 50 50)"/>
    <line x1="50" y1="8"  x2="50" y2="30" transform="rotate(120 50 50)"/>
    <line x1="50" y1="8"  x2="50" y2="30" transform="rotate(180 50 50)"/>
    <line x1="50" y1="8"  x2="50" y2="30" transform="rotate(240 50 50)"/>
    <line x1="50" y1="8"  x2="50" y2="30" transform="rotate(300 50 50)"/>
  </g>
  <g stroke="#1A161A" stroke-width="7" stroke-linecap="round">
    <line x1="50" y1="18" x2="50" y2="30" transform="rotate(30 50 50)"/>
    <line x1="50" y1="18" x2="50" y2="30" transform="rotate(90 50 50)"/>
    <line x1="50" y1="18" x2="50" y2="30" transform="rotate(150 50 50)"/>
    <line x1="50" y1="18" x2="50" y2="30" transform="rotate(210 50 50)"/>
    <line x1="50" y1="18" x2="50" y2="30" transform="rotate(270 50 50)"/>
    <line x1="50" y1="18" x2="50" y2="30" transform="rotate(330 50 50)"/>
  </g>
</svg>
